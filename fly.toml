# fly.toml app configuration file generated for navlo-backend on 2026-09-08T19:55:38+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'navlo-backend'
primary_region = 'fra'

[build]
[env]
  PORT = '4000'

# No volume mount needed — the database is Turso (hosted libSQL), reached over
# the network via TURSO_DATABASE_URL/TURSO_AUTH_TOKEN (set as `fly secrets`,
# not here — never commit real credentials to fly.toml).

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
